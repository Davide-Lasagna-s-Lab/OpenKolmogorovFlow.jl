<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 300" role="img" aria-labelledby="title desc">
  <title id="title">OpenKolmogorovFlow.jl logo</title>
  <desc id="desc">A Julia-colored logo for OpenKolmogorovFlow.jl using flow artwork inside a rounded panel beside the package wordmark.</desc>
  <defs>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f6f8fb"/>
    </linearGradient>
    <linearGradient id="domain" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef3f8"/>
    </linearGradient>
    <linearGradient id="red-blue" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#cb3c33"/>
      <stop offset="0.55" stop-color="#9558b2"/>
      <stop offset="1" stop-color="#4063d8"/>
    </linearGradient>
    <linearGradient id="green-purple" x1="0" x2="1" y1="1" y2="0">
      <stop offset="0" stop-color="#389826"/>
      <stop offset="0.55" stop-color="#4063d8"/>
      <stop offset="1" stop-color="#9558b2"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#172033" flood-opacity="0.14"/>
    </filter>
    <filter id="soft-glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="domain-clip">
      <rect x="0" y="0" width="340" height="196" rx="22"/>
    </clipPath>
  </defs>

  <rect x="24" y="24" width="1032" height="252" rx="28" fill="url(#panel)" filter="url(#shadow)"/>

  <g transform="translate(70 52)">
    <rect x="0" y="0" width="340" height="196" rx="22" fill="url(#domain)"/>
    <image href="artwork.png" x="0" y="0" width="340" height="196" preserveAspectRatio="xMidYMid slice" clip-path="url(#domain-clip)"/>
    <rect x="0" y="0" width="340" height="196" rx="22" fill="#ffffff" opacity="0.16"/>

    <g stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" opacity="0.45">
      <line x1="28" y1="49" x2="312" y2="49"/>
      <line x1="28" y1="98" x2="312" y2="98"/>
      <line x1="28" y1="147" x2="312" y2="147"/>
      <line x1="85" y1="22" x2="85" y2="174"/>
      <line x1="170" y1="22" x2="170" y2="174"/>
      <line x1="255" y1="22" x2="255" y2="174"/>
    </g>

    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 98 C58 66, 102 68, 140 94 S222 132, 322 92" stroke="#2f3441" stroke-width="5.5" opacity="0.78"/>
      <path d="M20 125 C61 92, 106 96, 143 122 S224 160, 320 121" stroke="#2f3441" stroke-width="4.5" opacity="0.64"/>
      <path d="M42 99 C84 67, 113 69, 143 91 S195 128, 226 110 S280 82, 306 98" stroke="url(#red-blue)" stroke-width="6" opacity="0.76"/>
      <path d="M42 101 C84 128, 113 126, 143 105 S195 68, 226 87 S280 116, 306 100" stroke="url(#green-purple)" stroke-width="6" opacity="0.76"/>
    </g>

    <g filter="url(#soft-glow)" opacity="0.32">
      <circle cx="104" cy="76" r="24" fill="#cb3c33"/>
      <circle cx="236" cy="120" r="24" fill="#4063d8"/>
      <circle cx="98" cy="126" r="18" fill="#389826"/>
      <circle cx="243" cy="72" r="18" fill="#9558b2"/>
    </g>

    <g fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.92">
      <circle cx="104" cy="76" r="15"/>
      <circle cx="236" cy="120" r="15"/>
      <circle cx="98" cy="126" r="12"/>
      <circle cx="243" cy="72" r="12"/>
    </g>

    <g stroke="#ffffff" stroke-width="3">
      <circle cx="104" cy="76" r="8" fill="#cb3c33"/>
      <circle cx="236" cy="120" r="8" fill="#4063d8"/>
      <circle cx="98" cy="126" r="6" fill="#389826"/>
      <circle cx="243" cy="72" r="6" fill="#9558b2"/>
    </g>

    <rect x="0" y="0" width="340" height="196" rx="22" fill="none" stroke="#d7dce6" stroke-width="4"/>
  </g>

  <g transform="translate(454 78)">
    <text x="0" y="52" font-family="Inter, Avenir, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#242936" letter-spacing="0">OpenKolmogorovFlow.jl</text>
    <text x="2" y="92" font-family="Inter, Avenir, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#5c6475" letter-spacing="0">spectral Kolmogorov-flow operators</text>
    <text x="2" y="122" font-family="Inter, Avenir, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#5c6475" letter-spacing="0">for Flows.jl time integration</text>
  </g>
</svg>
